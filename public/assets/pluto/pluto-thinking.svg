<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Pluto Thinking / Concentrating -->
  <defs>
    <linearGradient id="goldCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD15C"/>
      <stop offset="60%" stop-color="#FDB813"/>
      <stop offset="100%" stop-color="#E59E0B"/>
    </linearGradient>
    <linearGradient id="earShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E59E0B"/>
      <stop offset="100%" stop-color="#C67D05"/>
    </linearGradient>
    <linearGradient id="collarBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <ellipse cx="100" cy="182" rx="60" ry="10" fill="#CBD5E1" opacity="0.6"/>

  <!-- Thought bubble doodle above Pluto -->
  <g opacity="0.9" transform="translate(115, 10) scale(0.65)">
    <circle cx="20" cy="55" r="4" fill="#93C5FD"/>
    <circle cx="30" cy="45" r="6" fill="#60A5FA"/>
    <path d="M40,25 C35,15 50,5 65,12 C75,5 95,8 100,20 C112,18 120,28 116,40 C124,50 115,65 102,62 C95,72 75,70 65,65 C52,70 40,60 42,48 C34,40 35,28 40,25 Z" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="75" y="44" font-family="sans-serif" font-weight="bold" font-size="20" fill="#1D4ED8" text-anchor="middle">₹ ?</text>
  </g>

  <!-- Body -->
  <g filter="url(#softShadow)">
    <path d="M70,110 C60,125 55,145 65,168 C75,178 95,178 100,172 C105,178 125,178 135,168 C145,145 140,125 130,110 Z" fill="url(#goldCoat)"/>
    <path d="M78,95 C75,115 80,140 100,155 C120,140 125,115 122,95 Z" fill="#FFE28A"/>
    <!-- Left Paw Sitting -->
    <path d="M80,140 L82,175 C82,179 75,182 70,180 C65,178 68,172 70,145 Z" fill="url(#goldCoat)"/>
    <ellipse cx="73" cy="178" rx="8" ry="5" fill="url(#goldCoat)"/>
    <!-- Right Paw Raised to Chin / Thinking Pose -->
    <path d="M120,135 C125,125 128,110 115,102 C110,98 105,105 110,112 C114,120 118,140 125,155 Z" fill="url(#goldCoat)"/>
    <ellipse cx="112" cy="104" rx="7" ry="6" fill="url(#goldCoat)"/>
  </g>

  <!-- Collar -->
  <g id="plutoCollar">
    <path d="M78,96 Q100,105 122,96 Q120,103 100,111 Q80,103 78,96 Z" fill="url(#collarBlue)"/>
    <circle cx="100" cy="114" r="7" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <!-- Tilted Head Group (-8deg) -->
  <g transform="rotate(-8 95 65)" filter="url(#softShadow)">
    <ellipse cx="95" cy="65" rx="36" ry="32" fill="url(#goldCoat)"/>
    <!-- Left ear up curiously -->
    <path d="M63,48 C45,45 40,68 46,88 C50,98 62,95 64,82 Z" fill="url(#earShadow)"/>
    <!-- Right ear relaxed -->
    <path d="M127,52 C145,55 152,75 146,95 C142,105 130,102 127,90 Z" fill="url(#earShadow)"/>

    <ellipse cx="95" cy="74" rx="22" ry="16" fill="#FFE28A"/>
    <path d="M87,68 Q95,64 103,68 Q104,75 95,78 Q86,75 87,68 Z" fill="#1E293B"/>
    <ellipse cx="92" cy="68" rx="3" ry="1.5" fill="#64748B"/>
    <path d="M91,80 Q96,82 101,79" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>

    <!-- Curious Eyes Looking Upward -->
    <ellipse cx="80" cy="54" rx="5.5" ry="6.5" fill="#1E293B"/>
    <ellipse cx="80" cy="54" rx="4" ry="5" fill="#78350F"/>
    <circle cx="81" cy="51" r="2" fill="#FFFFFF"/>
    <!-- One eyebrow raised higher! -->
    <path d="M74,44 Q82,38 88,43" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>

    <ellipse cx="110" cy="56" rx="5.5" ry="6.5" fill="#1E293B"/>
    <ellipse cx="110" cy="56" rx="4" ry="5" fill="#78350F"/>
    <circle cx="111" cy="53" r="2" fill="#FFFFFF"/>
    <path d="M104,49 Q110,48 116,51" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
