<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Pluto Running / Sprinting -->
  <defs>
    <linearGradient id="goldCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD15C"/>
      <stop offset="60%" stop-color="#FDB813"/>
      <stop offset="100%" stop-color="#E59E0B"/>
    </linearGradient>
    <linearGradient id="collarBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Speed Motion Lines Behind -->
  <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <line x1="20" y1="90" x2="50" y2="90"/>
    <line x1="10" y1="105" x2="45" y2="105"/>
    <line x1="25" y1="120" x2="60" y2="120"/>
  </g>

  <!-- Pluto Sprinting Forward -->
  <g transform="translate(15, 10)">
    <!-- High Trail Tail -->
    <path d="M40,110 C20,95 25,70 38,55 C45,62 38,80 50,105 Z" fill="url(#goldCoat)"/>

    <!-- Hind Legs Extended Back -->
    <path d="M55,115 L25,145 C20,150 28,155 35,150 L65,125 Z" fill="url(#goldCoat)"/>
    <ellipse cx="25" cy="150" rx="6" ry="4" fill="url(#goldCoat)"/>

    <!-- Torso Extended -->
    <ellipse cx="95" cy="105" rx="42" ry="24" transform="rotate(-10 95 105)" fill="url(#goldCoat)"/>
    <ellipse cx="95" cy="108" rx="28" ry="16" transform="rotate(-10 95 108)" fill="#FFE28A"/>

    <!-- Front Legs Extended Forward -->
    <path d="M120,110 L155,140 C160,145 168,140 162,135 L132,105 Z" fill="url(#goldCoat)"/>
    <ellipse cx="162" cy="140" rx="6" ry="4" fill="url(#goldCoat)"/>

    <!-- Blue Collar with Tag flying in wind -->
    <path d="M122,88 L134,94 L130,102 L118,96 Z" fill="url(#collarBlue)"/>
    <circle cx="135" cy="105" r="5" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>

    <!-- Head Stretched Forward with Determination -->
    <ellipse cx="138" cy="80" rx="24" ry="20" fill="url(#goldCoat)"/>
    <ellipse cx="148" cy="86" rx="14" ry="10" fill="#FFE28A"/>
    <path d="M156,82 Q160,78 163,82 Q161,87 157,88 Z" fill="#1E293B"/>

    <!-- Flying Ears Back in Wind -->
    <path d="M120,72 C105,65 95,80 102,95 C106,102 118,98 120,88 Z" fill="#E59E0B"/>

    <!-- Determined Focused Eye -->
    <ellipse cx="138" cy="74" rx="4.5" ry="5" fill="#1E293B"/>
    <circle cx="140" cy="72" r="1.5" fill="#FFFFFF"/>
    <!-- Determined brow -->
    <path d="M132,68 L142,70" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>

    <!-- Open Happy Mouth with Tongue Out -->
    <path d="M144,90 Q152,94 158,90" fill="none" stroke="#1E293B" stroke-width="2"/>
    <path d="M148,93 C148,102 156,102 156,93 Z" fill="#F43F5E"/>
  </g>
</svg>
