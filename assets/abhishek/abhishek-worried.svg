<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Abhishek Worried Searching on Floor 5 -->
  <defs>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8B888"/>
      <stop offset="100%" stop-color="#D49E6A"/>
    </linearGradient>
    <linearGradient id="navyShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0A2463"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="92" fill="#FEF2F2" stroke="#EF4444" stroke-width="3"/>

  <!-- Shoulders -->
  <path d="M40,192 C42,150 70,140 100,140 C130,140 158,150 160,192 Z" fill="url(#navyShirt)"/>
  <polygon points="100,154 82,140 96,138 100,146 104,138 118,140" fill="#FFFFFF"/>

  <!-- Neck -->
  <rect x="88" y="118" width="24" height="24" rx="6" fill="url(#skinTone)"/>

  <!-- Hand on Forehead / Worried Pose -->
  <g id="handOnHead">
    <path d="M140,150 C145,130 142,105 130,85 C125,75 115,75 120,85 C125,95 130,115 125,140 Z" fill="url(#navyShirt)"/>
    <ellipse cx="120" cy="74" rx="10" ry="8" fill="url(#skinTone)"/>
  </g>

  <!-- Head -->
  <ellipse cx="96" cy="80" rx="26" ry="30" fill="url(#skinTone)"/>
  <!-- Hair -->
  <path d="M68,74 C66,50 82,34 100,34 C120,34 134,50 132,74 C128,60 120,44 100,44 C84,44 72,56 68,74 Z" fill="#1E293B"/>

  <!-- Concerned Eyebrows (Slanted Upward in Middle) -->
  <path d="M78,68 Q86,64 92,69" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M102,69 Q108,64 116,68" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Glasses -->
  <rect x="75" y="72" width="18" height="15" rx="3" fill="none" stroke="#0F172A" stroke-width="2"/>
  <rect x="99" y="72" width="18" height="15" rx="3" fill="none" stroke="#0F172A" stroke-width="2"/>
  <line x1="93" y1="78" x2="99" y2="78" stroke="#0F172A" stroke-width="2"/>
  <ellipse cx="84" cy="80" rx="3.5" ry="4" fill="#111827"/>
  <ellipse cx="108" cy="80" rx="3.5" ry="4" fill="#111827"/>

  <!-- Worried Mouth (Wavy line) -->
  <path d="M86,104 Q94,101 100,105 Q106,108 112,103" fill="none" stroke="#9A3412" stroke-width="2" stroke-linecap="round"/>

  <!-- Sweat drop -->
  <path d="M125,58 C125,54 122,50 120,48 C118,50 115,54 115,58 C115,62 125,62 125,58 Z" fill="#60A5FA"/>
</svg>
